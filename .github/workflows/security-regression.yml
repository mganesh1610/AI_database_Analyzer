name: Security regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python security tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Node security tests
        run: node --test tests/capture_site.test.js tests/frontend_auth.test.js
      - name: Parse snapshot helper
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'schema_snapshots/export_schema_snapshot.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Capture local fixture with Chrome pipe
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) { throw 'Chrome is not installed on this runner.' }
          $output = Join-Path $env:RUNNER_TEMP 'schema-atlas-capture.png'
          node scripts/capture_site.js $chrome 'data:text/html,<html><body>Schema Atlas fixture</body></html>' $output 320 240
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output)) { throw 'Chrome pipe capture failed.' }
          $bytes = [System.IO.File]::ReadAllBytes($output)
          if ($bytes.Length -lt 8 -or $bytes[0] -ne 137 -or $bytes[1] -ne 80 -or $bytes[2] -ne 78 -or $bytes[3] -ne 71) { throw 'Capture did not produce a PNG.' }
